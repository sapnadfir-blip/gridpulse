name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    name: Python Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-cov

    - name: Run Pytest
      run: |
        pytest tests/ -v

  build-c:
    name: C Testbed Compilation
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install C Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev libpcap-dev

    - name: Compile C Binaries
      run: |
        gcc -O2 -pthread -Wall -Wextra -o goose_subscriber gridpulse/hardware/goose_subscriber.c -lssl -lcrypto
        gcc -O2 -Wall -Wextra -o goose_attacker gridpulse/hardware/goose_attacker.c
        gcc -O2 -pthread -Wall -Wextra -o goose_publisher gridpulse/hardware/goose_publisher.c -lssl -lcrypto
        gcc -O2 -Wall -Wextra -o crypto_bench gridpulse/hardware/crypto_bench.c -lssl -lcrypto

    - name: Test Compiled Subscriber CLI
      run: |
        ./goose_subscriber --help || true
